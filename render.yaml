# Hospedagem gratuita (Render): o servidor fica no ar, sem .bat e sem PC ligado.
# O servidor usa o pacote "ws" (instalado no build). Se faltar, cai no mini-ws.js embutido.
services:
  - type: web
    name: playhub
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev --no-audit --no-fund
    startCommand: node server.js --no-open
    healthCheckPath: /health
    envVars:
      - key: NO_OPEN
        value: "1"
      # Opcional, mas MUITO recomendado para jogar em 4G/5G: servidor TURN próprio (veja LEIA-ME).
      # Crie a variável PLAYHUB_ICE no painel do Render com o JSON da lista de servidores.
